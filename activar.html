<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activar MI NEGOCIO</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17201f;background:#f4f6f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#fff;border:1px solid #dfe5e3;border-radius:18px;padding:22px;box-shadow:0 12px 40px #0001}h1{margin:0 0 8px}.muted{color:#65706e}.drop{margin-top:18px;border:2px dashed #bcc8c4;border-radius:14px;padding:24px;text-align:center}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:750;cursor:pointer;background:#17201f;color:#fff}input{display:none}.ok{padding:12px;background:#e5f7ec;border-radius:11px;margin-top:15px}.err{padding:12px;background:#ffe9e9;border-radius:11px;margin-top:15px}</style></head>
<body><div class="card"><h1>Activar MI NEGOCIO</h1><div class="muted">Usá el archivo de alta generado desde MI NEGOCIO ADMIN.</div><div class="drop"><p><b>Seleccioná el archivo alta-….json</b></p><button class="btn" id="pick">Elegir archivo</button><input type="file" id="file" accept="application/json"></div><div id="msg"></div></div>
<script>(function(){'use strict';var KEY='mi-negocio-barberia-v4';var file=document.getElementById('file'),msg=document.getElementById('msg');document.getElementById('pick').onclick=function(){file.click()};file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result);if(!p||!p.business||!p.business.name||!p.business.slug||!p.ownerSecret)throw new Error('Archivo de alta incompleto.');var b=p.business;var data={settings:{businessName:b.name,ownerName:b.owner||'Administrador',businessType:'Barbería',profile:'barber',theme:'classic',onlineBookings:{enabled:true,slug:b.slug,publicBaseUrl:'',backendUrl:'https://mi-negocio-reservas.corbalanstefanis.workers.dev',ownerSecret:p.ownerSecret,deviceToken:'',deviceLabel:'Dispositivo principal',telegramEnabled:false,telegramChatId:'',telegramPairCode:'',openTime:'09:00',closeTime:'19:00',slotStep:15,minAdvanceHours:2,maxAdvanceDays:30,approvalMode:'auto',workingDays:[1,2,3,4,5,6],lastSyncAt:''}},clients:[],services:[],inventory:[],appointments:[],txns:[],wait:[],queue:[],logs:[]};localStorage.setItem(KEY,JSON.stringify(data));msg.className='ok';msg.textContent='Alta cargada correctamente. Abriendo el sistema limpio de '+b.name+'…';setTimeout(function(){location.href='./'},700)}catch(e){msg.className='err';msg.textContent=e.message||'No pude leer el archivo.'}};r.readAsText(f)}})();</script></body></html>
