<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Mi Negocio — Barbería MVP v8</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');

/* ============================================================
   TEMAS
   Clásico: rojo + azul + blanco de barbería.
   Sobrio: blanco + negro + grises.
   Solo cambia la apariencia; la lógica y los datos son los mismos.
   ============================================================ */
:root{
  --ink:#18191B;
  --ink-soft:#6B7280;
  --paper:#F2F3F5;
  --bg:#FFFFFF;
  --card:#FFFFFF;
  --line:#E1E3E7;
  --shadow:0 14px 34px rgba(20,31,46,.10);

  --dark:#151515;
  --barber-blue:#203F68;
  --barber-red:#BE3C33;
  --barber-white:#FFFFFF;

  --amber:#FFF3DA;      /* pendiente */
  --amberText:#8A5A17;
  --green:#E7F4EC;      /* confirmado / positivo */
  --greenText:#246847;
  --red:#FBE8EA;        /* cancelado / negativo */
  --redText:#B62F37;
  --blue:#E8F0FA;       /* pago parcial / info */
  --blueText:#174D84;
  --stone:#EDF1F5;      /* completado / neutro */
}

:root[data-theme="sober"]{
  --ink:#111111;
  --ink-soft:#686868;
  --paper:#ECECEC;
  --bg:#FFFFFF;
  --card:#FFFFFF;
  --line:#DDDDDD;
  --shadow:0 14px 34px rgba(0,0,0,.10);
  --dark:#050505;
  --barber-blue:#111111;
  --barber-red:#6C6C6C;
  --barber-white:#C8C8C8;
  --blue:#EEEEEE;
  --blueText:#222222;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.page{min-height:100vh;padding:22px 10px 32px;display:flex;justify-content:center;align-items:flex-start}
.phone{
  position:relative;width:min(100%,412px);height:min(800px,calc(100vh - 44px));min-height:640px;
  background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.content{flex:1;overflow-y:auto;padding-bottom:16px}
.content::-webkit-scrollbar{width:0}

/* -------- barra de estado superior: acento de caño de barbero -------- */
.topStatus{
  font-size:10.5px;color:var(--ink-soft);text-align:center;padding:8px 10px;
  background:var(--card);border-bottom:1px solid var(--line);position:relative;
  letter-spacing:.01em;
}
.topStatus::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--barber-red) 0 14px,var(--barber-white) 14px 22px,var(--barber-blue) 22px 36px,var(--barber-white) 36px 44px);
  opacity:.9;
}
.badgeDot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--barber-blue);margin-right:6px}

/* -------- encabezados -------- */
.header{padding:26px 22px 16px}
.eyebrow{font-size:13px;color:var(--ink-soft);font-weight:500}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:28px;line-height:1.08;margin:3px 0 0;letter-spacing:-.01em}
h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;margin:0 0 12px;letter-spacing:-.01em}
.section{padding:0 22px;margin-top:16px}
.headerFlex{display:flex;align-items:center}
.back{border:0;background:var(--card);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;padding:0;font-size:17px;color:var(--ink-soft);margin-right:10px;display:inline-flex;align-items:center;justify-content:center}

/* -------- tarjetas -------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 3px rgba(11,37,69,.05)}
.heroLabel{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}
.heroValue{font-family:"Fraunces",serif;font-size:34px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.pos{color:var(--greenText)}
.neg{color:var(--redText)}
.divider{height:1px;background:var(--line);margin:16px 0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.statValue{font-family:"Fraunces",serif;font-weight:600;font-size:19px}
.statLabel{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-weight:500}

.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 6px;text-align:center}
.mini strong{display:block;font-family:"Fraunces",serif;font-size:17px;font-weight:600}
.mini span{font-size:10px;color:var(--ink-soft);font-weight:500}

.alert{display:flex;gap:9px;align-items:center;border-radius:14px;padding:11px 13px;font-size:13px;background:var(--red);color:var(--redText);font-weight:500}
.info{border-radius:14px;padding:11px 13px;font-size:12.5px;background:var(--blue);color:var(--blueText);font-weight:500}
.installHint{background:var(--green);color:var(--greenText);border:1px solid #cfe6d8;border-radius:14px;padding:11px 13px;font-size:12.5px}

/* -------- acciones rápidas (Hoy) -------- */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.action{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px 4px;color:var(--ink);transition:transform .1s ease,background .15s ease}
.action:active{transform:scale(.96);background:var(--paper)}
.actionIcon{width:38px;height:38px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;background:var(--dark);color:#fff;font-weight:700;font-size:16px}
.actionLabel{font-size:10.5px;color:var(--ink-soft);font-weight:700}
.action:nth-child(2n) .actionIcon{background:var(--barber-red)}
.action:nth-child(3n) .actionIcon{background:var(--barber-blue)}

/* -------- listas y filas -------- */
.list{display:flex;flex-direction:column;gap:9px}
.row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:background .12s ease}
button.row:active{background:var(--paper)}
.rowMain{min-width:0;flex:1}
.rowTitle{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.rowSub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:500}
.empty{font-size:13px;color:var(--ink-soft);padding:10px 2px;text-align:center}

.pill{font-size:10px;font-weight:700;border-radius:999px;padding:5px 10px;white-space:nowrap;letter-spacing:.01em}
.pill.pending{background:var(--amber);color:var(--amberText)}
.pill.confirmed{background:var(--green);color:var(--greenText)}
.pill.completed{background:var(--stone);color:var(--ink-soft)}
.pill.cancelled,.pill.no_show{background:var(--red);color:var(--redText)}
.pill.partial{background:var(--blue);color:var(--blueText)}

/* -------- navegación inferior -------- */
.nav{height:64px;border-top:1px solid var(--line);background:var(--card);display:grid;grid-template-columns:repeat(5,1fr);flex:none}
.nav button{border:0;background:transparent;color:var(--ink-soft);font-size:10px;font-weight:700;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button.active{color:var(--barber-blue)}
.navIcon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:15px;transition:background .15s ease,color .15s ease}
.nav button.active .navIcon{background:var(--barber-blue);color:#fff}

/* -------- buscador -------- */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;outline:none;font-size:14px}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--barber-blue);box-shadow:0 0 0 3px rgba(11,61,119,.10)}

/* -------- botón flotante -------- */
.fab{position:absolute;right:20px;bottom:82px;width:56px;height:56px;border:none;border-radius:50%;background:var(--barber-red);color:#fff;font-size:26px;box-shadow:0 10px 24px rgba(11,37,69,.28)}

/* -------- ficha técnica -------- */
.tech{background:var(--amber);border:1px solid #EAD6AC;border-radius:16px;padding:14px}
.techLabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--amberText);font-weight:800;margin-bottom:8px}
.techLine{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0;font-weight:500}

/* -------- sub-pestañas -------- */
.subtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:2px 22px 6px;overflow:visible}
.subtab{width:100%;min-height:40px;border:0;border-radius:14px;padding:7px 7px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);white-space:normal;line-height:1.15;font-size:11.5px;font-weight:700;text-align:center}
.subtab:nth-child(5),.subtab:nth-child(6){grid-column:span 2}
.subtab.active{background:var(--barber-blue);color:#fff;border-color:var(--barber-blue)}

/* -------- botones -------- */
.btn{border:0;border-radius:13px;padding:11px 13px;font-size:12.5px;font-weight:700;letter-spacing:.005em}
.btn.dark{background:var(--barber-blue);color:#fff}
.btn.amber{background:var(--amber);color:var(--amberText)}
.btn.green{background:var(--green);color:var(--greenText)}
.btn.red{background:var(--red);color:var(--redText)}
.btn.gray{background:var(--stone);color:var(--ink-soft)}
.btn.blue{background:var(--blue);color:var(--blueText)}
.btn.full{width:100%}
.btnRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

/* -------- plata / cuentas -------- */
.moneyAccounts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.account{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}
.account span{display:block;font-size:10px;color:var(--ink-soft);font-weight:600}
.account strong{display:block;margin-top:4px;font-family:"Fraunces",serif;font-size:16px;font-weight:600}

/* -------- reportes -------- */
.reportGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.report{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}
.report strong{display:block;font-family:"Fraunces",serif;font-size:17px;font-weight:600}
.report span{font-size:10px;color:var(--ink-soft);font-weight:600}

/* -------- modales -------- */
.modalWrap{position:absolute;inset:0;background:rgba(11,37,69,.46);display:flex;align-items:flex-end;z-index:30;backdrop-filter:blur(1px)}
.modal{width:100%;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 20px 22px}
.handle{width:38px;height:4px;background:#D8CFBE;border-radius:99px;margin:0 auto 14px}
.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modalHead h3{margin:0;font-family:"Fraunces",serif;font-weight:600;font-size:19px}
.close{border:0;background:var(--card);border:1px solid var(--line);width:30px;height:30px;border-radius:50%;color:var(--ink-soft);font-size:18px;display:inline-flex;align-items:center;justify-content:center}

.field{display:block;margin:11px 0}
.field span{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:11px 12px;outline:none}
.field textarea{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.note{font-size:11.5px;line-height:1.5;color:var(--ink-soft)}

/* -------- respaldo / negocio -------- */
.backupBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.profileTag{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--barber-blue);border-radius:999px;padding:7px 11px;font-size:10.5px;font-weight:800}

/* -------- insumos / recetas -------- */
.materialLine{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:9px;align-items:center;margin:8px 0}
.materialLine .name{font-size:12.5px;font-weight:500}
.materialLine .name small{display:block;color:var(--ink-soft);font-weight:400}
.materialLine input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card)}
.recipeBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:11px 0}
.recipeTitle{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}

/* -------- utilidades -------- */
.right{text-align:right}
.dangerText{color:var(--redText)}
.goodText{color:var(--greenText)}
.muted{color:var(--ink-soft)}
.linkBtn{text-decoration:none;display:inline-block}
.compact{padding:9px 11px}
.flexBetween{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.touch{min-height:44px}
.inlineCreate{margin:10px 0 12px;padding:12px;border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.55)}
.inlineCreateTitle{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.txnActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.privacyStrong{background:var(--blue);color:var(--blueText);border:1px solid #cbdbea;border-radius:14px;padding:12px 13px;font-size:12px;line-height:1.45}

/* -------- selector de apariencia -------- */
.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themeChoice{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:11px;text-align:left;transition:border-color .15s ease,transform .1s ease}
.themeChoice:active{transform:scale(.98)}
.themeChoice.active{border-color:var(--barber-blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--barber-blue) 12%,transparent)}
.themePreview{height:78px;border-radius:12px;background:#fff;border:1px solid #E4E4E4;padding:9px;overflow:hidden;position:relative}
.themePreview::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.themePreview.classic::before{background:repeating-linear-gradient(90deg,#BE3C33 0 12px,#fff 12px 18px,#203F68 18px 30px,#fff 30px 36px)}
.themePreview.sober::before{background:#111}
.themeMiniTitle{height:6px;width:42%;border-radius:4px;background:#222;margin:10px 0 7px}
.themeMiniCard{height:26px;border:1px solid #E0E0E0;border-radius:7px;margin-bottom:7px}
.themeSwatches{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.themeSwatches i{height:12px;border-radius:5px;display:block}
.themePreview.classic .themeSwatches i:nth-child(1){background:#BE3C33}.themePreview.classic .themeSwatches i:nth-child(2){background:#203F68}.themePreview.classic .themeSwatches i:nth-child(3){background:#151515}
.themePreview.sober .themeSwatches i:nth-child(1){background:#050505}.themePreview.sober .themeSwatches i:nth-child(2){background:#707070}.themePreview.sober .themeSwatches i:nth-child(3){background:#C8C8C8}
.themeName{display:block;font-size:12px;font-weight:800;margin-top:8px}.themeDesc{display:block;font-size:10px;color:var(--ink-soft);margin-top:2px}
:root[data-theme="sober"] .topStatus::before{background:linear-gradient(90deg,#050505 0 34%,#6C6C6C 34% 67%,#C8C8C8 67% 100%)}
:root[data-theme="sober"] .action:nth-child(2n) .actionIcon{background:#6C6C6C}
:root[data-theme="sober"] .action:nth-child(3n) .actionIcon{background:#111111}
:root[data-theme="sober"] .fab{background:#111111;box-shadow:0 10px 24px rgba(0,0,0,.22)}
:root[data-theme="sober"] .search:focus,:root[data-theme="sober"] .field input:focus,:root[data-theme="sober"] .field select:focus,:root[data-theme="sober"] .field textarea:focus{box-shadow:0 0 0 3px rgba(0,0,0,.08)}

/* -------- agenda -------- */
.agendaBar{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center}
.agendaBar .btn{min-height:42px}
.agendaDate{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 9px;color:var(--ink)}
.agendaSummary{font-size:11.5px;color:var(--ink-soft);margin-top:9px;font-weight:500}
.slotFreed{background:var(--amber);border:1px solid #EAD6AC;color:var(--amberText);border-radius:15px;padding:12px 13px;font-size:12.5px}
.waitMatch{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:9px}


/* -------- reservas online -------- */
.bookingLink{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.bookingUrl{font-size:11px;line-height:1.4;word-break:break-all;margin-top:5px;font-weight:700;color:var(--barber-blue)}
.dayChoices{display:flex;gap:7px;flex-wrap:wrap}
.dayChoices label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--card);font-size:11px;font-weight:700;color:var(--ink-soft)}
.dayChoices input{width:auto;min-height:0}

@media(max-height:700px) and (min-width:521px){.phone{height:calc(100vh - 20px);min-height:0}.page{padding:10px}}

@media(max-width:520px){
 html,body{width:100%;min-height:100%;background:var(--bg);overscroll-behavior:none}
 .page{padding:0;display:block;min-height:100dvh}
 .phone{width:100%;height:100dvh;min-height:100dvh;max-width:none;border:0;border-radius:0;box-shadow:none}
 .topStatus{padding-top:calc(8px + env(safe-area-inset-top));min-height:calc(30px + env(safe-area-inset-top))}
 .nav{height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
 .nav button{min-height:52px}
 .header{padding-left:18px;padding-right:18px}
 .section{padding-left:18px;padding-right:18px}
 .subtabs{padding-left:18px;padding-right:18px}
 .btn{min-height:42px}
 .action{min-height:74px}
 .field input,.field select,.field textarea{font-size:16px;min-height:44px}
 .modalWrap{position:fixed}
 .modal{max-height:92dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
 .fab{bottom:calc(78px + env(safe-area-inset-bottom));right:18px}
 .agendaBar{grid-template-columns:1fr 1fr}
 .agendaDate{grid-column:1/-1;min-height:44px;font-size:16px}
 .two{gap:8px}
 .materialLine{grid-template-columns:minmax(0,1fr) 96px}
}
@media(max-width:360px){
 .section{padding-left:14px;padding-right:14px}
 .header{padding-left:14px;padding-right:14px}
 .actions{gap:6px}
 .actionLabel{font-size:9px}
 .btnRow{gap:6px}
 .btn{padding:10px 9px}
 .stats{gap:5px}
}
</style>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#203F68" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="./icon-192.png" />
</head>
<body>
<div class="page"><main class="phone"><div class="topStatus"><span class="badgeDot"></span>Privacidad: caja, costos, stock y reportes quedan en este dispositivo</div><div id="content" class="content"></div><div id="nav" class="nav"></div><div id="modal"></div></main></div>
<script>
(() => {
'use strict';
const KEY='mi-negocio-barberia-v4';
const OLD_KEY='mi-negocio-offline-v3';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=iso();
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const days=(a,b=TODAY)=>Math.max(0,Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));
const fqty=n=>Number.isInteger(Number(n))?String(n):Number(n||0).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
const short=d=>new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'short'}).format(new Date(d+'T00:00:00'));
const id=p=>p+Date.now()+Math.random().toString(16).slice(2,6);
const accounts=[{id:'a1',name:'Efectivo'},{id:'a2',name:'Mercado Pago'},{id:'a3',name:'Banco'}];
const BARBER_PROFILE={id:'barber',label:'Barbería',clientLabel:'Cliente',serviceLabel:'Servicio',modules:['turnos','fila','espera','servicios','insumos']};

function fresh(){return {

function phoneDigits(p){return String(p||'').replace(/\D/g,'')}
function whatsappNumber(phone){
 let n=phoneDigits(phone);
 if(!n)return '';
 // Prefijo internacional escrito como 00...
 if(n.startsWith('00'))n=n.slice(2);
 // +54 9 0XX... -> quitar el 0 troncal que a veces queda copiado.
 if(n.startsWith('5490'))n='549'+n.slice(4);
 // +54 0XX... -> quitar 0 troncal y luego tratarlo como móvil argentino.
 if(n.startsWith('540'))n='54'+n.slice(3);
 // Formato viejo local: 0 + característica + 15 + número.
 // Tras sacar el 0 quedan 12 dígitos; eliminamos el 15 ubicado después de
 // características argentinas habituales de 2, 3 o 4 dígitos.
 if(n.startsWith('0')&&n.length===13){
   let national=n.slice(1);
   for(const pos of [2,3,4]){
     if(national.slice(pos,pos+2)==='15'){national=national.slice(0,pos)+national.slice(pos+2);break}
   }
   n=national;
 }else if(n.startsWith('0')&&n.length===11){
   n=n.slice(1);
 }
 // 54 + número nacional sin 9 móvil.
 if(n.startsWith('54')&&!n.startsWith('549')&&n.length===12)n='549'+n.slice(2);
 // Número nacional argentino (característica + abonado).
 if(!n.startsWith('54')&&n.length===10)n='549'+n;
 // Si ya vino como 549 + 10 dígitos, queda tal cual.
 return n;
}

function moreView(){const range=reportRange(),tx=data.txns.filter(t=>inRange(t.date,range.start,range.end)),inc=tx.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0),exp=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0),logs=data.logs.filter(l=>inRange(l.date,range.start,range.end)),mats=logs.reduce((s,l)=>s+Number(l.total||0),0),aps=data.appointments.filter(a=>inRange(a.date,range.start,range.end)),completed=aps.filter(a=>a.status==='completed'),sales=completed.reduce((s,a)=>s+Number(a.price||0),0),grossMargin=sales-mats,rq=completed.map(a=>({...a,balance:Math.max(0,Number(a.price||0)-Number(a.paidAmount||0))})).filter(a=>a.balance>0);const pwaReady=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';return `<header class="header"><h1>Más</h1></header><section class="section"><h2>Mi negocio</h2><div class="card"><div class="profileTag">✂ Barbería · versión madre</div><div class="rowTitle" style="margin-top:10px">${esc(data.settings.businessName)}</div><div class="rowSub">${esc(data.settings.ownerName)}</div><div class="btnRow"><button class="btn dark" data-edit-business>Editar negocio</button></div><div class="note" style="margin-top:9px">Este perfil es la base. Los demás rubros se adaptarán después sin cambiar el motor.</div></div></section><section class="section"><h2>Apariencia</h2><div class="themeGrid"><button class="themeChoice ${data.settings.theme!=='sober'?'active':''}" data-theme-choice="classic"><div class="themePreview classic"><div class="themeMiniTitle"></div><div class="themeMiniCard"></div><div class="themeSwatches"><i></i><i></i><i></i></div></div><span class="themeName">Clásico barbería</span><span class="themeDesc">Rojo · azul · blanco</span></button><button class="themeChoice ${data.settings.theme==='sober'?'active':''}" data-theme-choice="sober"><div class="themePreview sober"><div class="themeMiniTitle"></div><div class="themeMiniCard"></div><div class="themeSwatches"><i></i><i></i><i></i></div></div><span class="themeName">Sobrio</span><span class="themeDesc">Negro · gris · blanco</span></button></div><div class="note" style="margin-top:8px">La elección se guarda en este dispositivo y no cambia tus datos ni funciones.</div></section><section class="section"><div class="flexBetween"><h2 style="margin-bottom:0">Reportes</h2><div class="rowSub">${range.label}</div></div><div class="btnRow"><button class="btn ${reportPeriod==='today'?'dark':'gray'}" data-report-period="today">Hoy</button><button class="btn ${reportPeriod==='week'?'dark':'gray'}" data-report-period="week">Semana</button><button class="btn ${reportPeriod==='month'?'dark':'gray'}" data-report-period="month">Mes</button></div><div class="reportGrid" style="margin-top:10px"><div class="report"><strong>${money(inc)}</strong><span>Entradas de caja</span></div><div class="report"><strong>${money(exp)}</strong><span>Salidas de caja</span></div><div class="report"><strong>${money(mats)}</strong><span>Material consumido</span></div><div class="report"><strong>${money(grossMargin)}</strong><span>Margen bruto de trabajos</span></div><div class="report"><strong>${aps.filter(a=>a.status==='no_show').length}</strong><span>No-shows</span></div><div class="report"><strong>${money(rq.reduce((s,a)=>s+a.balance,0))}</strong><span>Por cobrar del período</span></div></div><div class="note" style="margin-top:8px">Caja y costo de materiales se muestran separados. El margen bruto resta materiales de los trabajos, no gastos fijos.</div></section><section class="section"><h2>WhatsApp</h2><div class="backupBox"><div class="installHint"><b>Automatización asistida.</b> La app prepara confirmaciones, recordatorios, lista de espera, seguimiento y saldos. WhatsApp se abre con el texto listo y vos tocás Enviar.</div><div class="note" style="margin-top:8px">El envío totalmente automático en segundo plano requiere WhatsApp Business Platform y un servidor; esta versión no sube datos de tus clientes.</di function appHistoryState(extra={}){return {miNegocio:true,tab,sub,selected,agendaDate,...extra}}

function clientOptions(selectedId=''){return data.clients.map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}

 if(kind==='client'){openClientModal(null);return}
 if(kind==='income'||kind==='expense'){const isInc=kind==='income';modal(isInc?'Registrar cobro':'Registrar gasto',`<label class="field"><span>Monto</span><input id="mAmount" type="number" min="0" placeholder="$ 0"></label><label class="field"><span>Categoría</span><select id="mCat">${(isInc?['Servicio','Producto','Seña','Otro ingreso']:['Insumos','Alquiler','Comisión','Otro gasto']).map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field"><span>${isInc?'Cobrado en':'Pagado desde'}</span><select id="mAccount">${accountOptions()}</select></label>${isInc?`<label class="field"><span>Cliente (opcional)</span><select id="mClient"><option value="">— Sin cliente —</option>${clientOptions()}</select></label>`:''}<label class="field"><span>Descripción (opcional)</span><input id="mDesc"></label><button class="btn dark full" id="mSave">Guardar</button>`);$('#mSave').onclick=()=>saveSimpleModal(kind,preset);return}

function saveSimpleModal(kind,preset={}){
 let createdAppointmentId=null;
 if(kind==='appointment'){const sid=$('#mService').value,date=$('#mDate').value,time=$('#mTime').value,f=Number($('#mFactor').value),deposit=Number($('#mDeposit').value||0),price=Number(service(sid)?.price||0),hasClient=Boolean($('#mClient').value||$('#mNewClientName').value.trim());if(!hasClient||!sid||!date)return alert('Elegí o creá un cliente y completá servicio y fecha.');if(deposit<0||deposit>price)return alert('La seña no puede superar el precio del servicio.');const cid=resolveModalClient();if(!cid)return alert('Ingresá el nombre del nuevo cliente.');const apId=id('ap');createdAppointmentId=apId;data.appointments.push({id:apId,clientId:cid,serviceId:sid,date,time,status:'pending',price,factor:f,label:factorLabel(f),consumed:false,paidAmount:deposit,depositAmount:deposit,paymentStatus:deposit>=price&&price>0?'paid':deposit>0?'partial':'pending',note:$('#mNote').value.trim(),waConfirmSentAt:'',waReminderSentAt:''});if(deposit>0)data.txns.unshift({id:id('t'),clientId:cid,appointmentId:apId,source:'deposit',type:'income',cat:'Seña',amount:deposit,accountId:$('#mDepositAccount').value,date:TODAY,desc:`Seña · ${service(sid)?.name||'Servicio'}`});agendaDate=date;if(preset.waitId)data.wait=data.wait.filter(w=>w.id!==preset.waitId)}
 if(kind==='walkin'){const sid=$('#mService').value,f=Number($('#mFactor').value),hasClient=Boolean($('#mClient').value||$('#mNewClientName').value.trim());if(!hasClient||!sid)return alert('Elegí un cliente o crealo acá con su nombre.');const cid=resolveModalClient();if(!cid)return alert('Ingresá el nombre del nuevo cliente.');const d=new Date();data.queue.push({id:id('q'),clientId:cid,name:'',phone:'',serviceId:sid,factor:f,label:factorLabel(f),arrival:`${pad(d.getHours())}:${pad(d.getMinutes())}`,status:'waiting'})}
 if(kind==='wait'){const cid=$('#mClient').value;if(!cid)return alert('Elegí un cliente.');const from=$('#mFrom').value,to=$('#mTo').value;if(from&&to&&from>to)return alert('El horario “desde” no puede ser posterior a “hasta”.');data.wait.unshift({id:id('w'),clientId:cid,serviceId:$('#mService').value||'',date:$('#mDate').value||'',from,to,pref:$('#mPref').value.trim()})}
 if(kind==='income'||kind==='expense'){const amount=Number($('#mAmount').value);if(!amount)return alert('Ingresá un monto.');data.txns.unshift({id:id('t'),clientId:kind==='income'?($('#mClient').value||null):null,appointmentId:null,source:'manual',type:kind==='income'?'income':'expense',cat:$('#mCat').value,amount,accountId:$('#mAccount').value,date:TODAY,desc:$('#mDesc').value.trim()})}
 save();closeModal();render();if(createdAppointmentId)openAppointmentSaved(createdAppointmentId)

function openAppointmentSaved(apId){const a=data.appointments.find(x=>x.id===apId),c=client(a?.clientId);if(!a)return;modal('Turno guardado',`<div class="installHint">✓ ${esc(c?.name||'Cliente')} · ${fullDate(a.date)} · ${esc(appointmentTimeLabel(a))}</div>${c?.phone?`<div class="note" style="margin:12px 0">Podés enviar la confirmación ahora.</div><button class="btn green full" id="mSendWa">Enviar confirmación por WhatsApp</button>`:`<div class="note" style="margin:12px 0">Este cliente no tiene teléfono cargado.</div>`}<button class="btn gray full" style="margin-top:8px" id="mDone">Listo</button>`);const send=$('#mSendWa');if(send)send.onclick=()=>sendAppointmentWhatsApp(apId,'confirmation');$('#mDone').onclick=closeModal}

function openClientModal(clientId){const c=clientId?client(clientId):null;modal(c?'Editar cliente':'Nuevo cliente',`<label class="field"><span>Nombre</span><input id="mName" value="${esc(c?.name||'')}"></label><label class="field"><span>Teléfono</span><input id="mPhone" value="${esc(c?.phone||'')}"></label><label class="field"><span>Frecuencia habitual (días)</span><input id="mFreq" type="number" min="1" value="${Number(c?.freq||30)}"></label><label class="field"><span>Ficha técnica</span><textarea id="mTech" placeholder="Una línea por dato. Ej:\nMáquina: Nº 2 costados\nBarba: perfilado recto">${esc(techToText(c?.tech||{}))}</textarea></label><div class="note">Usá formato “Campo: detalle”. La ficha podrá cambiar por rubro más adelante.</div><button class="btn dark full" id="mSave">Guardar</button>`);$('#mSave').onclick=()=>{const name=$('#mName').value.trim();if(!name)return alert('Ingresá el nombre.');const obj={id:c?.id||id('c'),name,phone:$('#mPhone').value.trim(),freq:Number($('#mFreq').value||30),tech:textToTech($('#mTech').value),followUpContactedFor:c?.followUpContactedFor||'',followUpContactedAt:c?.followUpContactedAt||''};if(c)data.clients=data.clients.map(x=>x.id===c.id?obj:x);else data.clients.unshift(obj);save();closeModal();render()}}
function recipeInputs(recipe=[]){return data.inventory.length?`<div class="recipeBox"><div class="recipeTitle">Materiales base por trabajo</div>${data.inventory.map(i=>{const r=recipe.find(x=>x.inventoryId===i.id);return `<div class="materialLine"><div class="name">${esc(i.name)}<small>${esc(i.unit)} · ${money(i.costUnit)}/${esc(i.unit)}</small></div><input class="recipeQty" data-inv="${i.id}" type="number" min="0" step="0.01" value="${r?Number(r.qty):0}"></div>`}).join('')}</div>`:'<div class="info">Primero cargá insumos para poder armar la receta.</div>'}

bj={id:s?.id||id('s'),name,duration,price,onlineEnabled,allowOverbook,maxConcurrent,recipe};if(s)data.services=data.services.map(x=>x.id===s.id?obj:x);else data.services.push(obj);save();closeModal();render()}}

function openRestock(invId){const i=inv(invId);if(!i)return;modal('Reponer '+i.name,`<div class="info">Stock actual: <b>${fqty(i.stock)} ${esc(i.unit)}</b></div><label class="field"><span>Cantidad que entra</span><input id="mQty" type="number" min="0" step="0.01"></label><label class="field"><span>Total pagado (opcional)</span><input id="mTotal" type="number" min="0" step="0.01" placeholder="$ 0"></label><label class="field"><span>Pagado desde</span><select id="mAccount">${accountOptions()}</select></label><div class="note">Si cargás el total pagado, se actualizará el costo por unidad de esta compra y se registrará la salida de caja.</div><button class="btn dark full" id="mSave">Registrar reposición</button>`);$('#mSave').onclick=()=>{const qty=Number($('#mQty').value),total=Number($('#mTotal').value||0);if(!qty)return alert('Ingresá la cantidad.');i.stock=Number(i.stock)+qty;if(total>0){const oldCost=Number(i.costUnit||0),newCost=total/qty;i.costUnit=newCost;registerCostIncrease(i,oldCost,newCost);data.txns.unshift({id:id('t'),clientId:null,appointmentId:null,source:'restock',type:'expense',cat:'Insumos',amount:total,accountId:$('#mAccount').value,date:TODAY,desc:`Reposición ${i.name}`})}save();closeModal();render()}}
function openEditTxn(txnId){const t=data.txns.find(x=>x.id===txnId);if(!t)return;const cats=t.type==='income'?['Servicio','Producto','Seña','Otro ingreso']:['Insumos','Alquiler','Comisión','Otro gasto'];modal('Editar movimiento',`${t.appointmentId?'<div class="info">Este ingreso está vinculado a un trabajo. Al cambiarlo, también se recalculará lo cobrado de ese turno.</div>':''}<label class="field"><span>Tipo</span><input value="${t.type==='income'?'Ingreso':'Gasto'}" disabled></label><label class="field"><span>Monto</span><input id="mAmount" type="number" min="0" step="0.01" value="${Number(t.amount||0)}"></label><label class="field"><span>Categoría</span><select id="mCat">${cats.map(c=>`<option ${c===t.cat?'selected':''}>${c}</option>`).join('')}</select></label><label class="field"><span>${t.type==='income'?'Cobrado en':'Pagado desde'}</span><select id="mAccount">${accountOptions(t.accountId)}</select></label><label class="field"><span>Fecha</span><input id="mDate" type="date" value="${t.date||TODAY}"></label>${t.type==='income'&&!t.appointmentId?`<label class="field"><span>Cliente (opcional)</span><select id="mClient"><option value="">— Sin cliente —</option>${clientOptions(t.clientId||'')}</select></label>`:t.appointmentId?`<div class="note">Cliente vinculado: <b>${esc(client(t.clientId)?.name||'Cliente')}</b></div>`:''}<label class="field"><span>Descripción (opcional)</span><input id="mDesc" value="${esc(t.desc||'')}"></label><button class="btn dark full" id="mSave">Guardar cambios</button>`);$('#mSave').onclick=()=>{const amount=Number($('#mAmount').value);if(!amount)return alert('Ingresá un monto válido.');if(t.appointmentId&&t.type==='income'){const a=data.appointments.find(x=>x.id===t.appointmentId);const other=data.txns.filter(x=>x.type==='income'&&x.appointmentId===t.appointmentId&&x.id!==t.id).reduce((sum,x)=>sum+Number(x.amount||0),0);if(a&&other+amount>Number(a.price||0))return alert('Ese monto haría que lo cobrado supere el precio del trabajo.')}t.amount=amount;t.cat=$('#mCat').value;t.accountId=$('#mAccount').value;t.date=$('#mDate').value||TODAY;t.desc=$('#mDesc').value.trim();if(t.type==='income'&&!t.appointmentId)t.clientId=$('#mClient').value||null;if(t.appointmentId)recalcAppointmentPaid(t.appointmentId);save();closeModal();render()}}
function deleteTxn(txnId){const t=data.txns.find(x=>x.id===txnId);if(!t)return;const linked=t.appointmentId?' Este movimiento está vinculado a un trabajo y su saldo se recalculará.':'';const stockNote=t.type==='expense'&&t.source==='restock'?' Esto anula solo el movimiento de caja; no modifica el stock ya repuesto.':'';if(!confirm(`¿Anular este ${t.type==='income'?'ingreso':'gasto'} de ${money(t.amount)}?${linked}${stockNote}`))return;const apId=t.appointmentId||null;data.txns=data.txns.filter(x=>x.id!==txnId);if(apId){const a=data.appointments.find(x=>x.id===apId);if(a){const linkedIncome=data.txns.filter(x=>x.type==='income'&&x.appointmentId===apId);const paid=linkedIncome.reduce((sum,x)=>sum+Number(x.amount||0),0);const deposit=linkedIncome.filter(x=>x.source==='deposit'||x.cat==='Seña').reduce((sum,x)=>sum+Number(x.amount||0),0);a.paidAmount=paid;a.depositAmount=deposit;a.paymentStatus=paid>=Number(a.price||0)?'paid':paid>0?'partial':'pending'}}save();render()}
function materialRowsFor(serviceId,factor=1){const s=service(serviceId);return (s?.recipe||[]).map(r=>{const i=inv(r.inventoryId);return {inventoryId:r.inventoryId,name:i?.name||'Insumo',unit:i?.unit||'',qty:Number(r.qty)*Number(factor),costUnit:Number(i?.costUnit||0)}})}
function finishMaterialsHtml(rows){return rows.length?`<div class="recipeBox"><div class="recipeTitle">Material usado — podés corregirlo antes de finalizar</div>${rows.map(r=>`<div class="materialLine"><div class="name">${esc(r.name)}<small>${esc(r.unit)} · stock ${fqty(inv(r.inventoryId)?.stock||0)}</small></div><input class="finishQty" data-inv="${r.inventoryId}" type="number" min="0" step="0.01" value="${fqty(r.qty)}"></div>`).join('')}</div>`:'<div class="info">Este servicio no tiene materiales configurados.</div>'}
function openFinishAppointment(apId){const a=data.appointments.find(x=>x.id===apId);if(!a)return;openFinish({mode:'appointment',appointment:a})}
function openFinishQueue(qId){const q=data.queue.find(x=>x.id===qId);if(!q)return;const temp={clientId:q.clientId,walkInName:q.name,serviceId:q.serviceId,date:TODAY,time:q.arrival,price:Number(service(q.serviceId)?.price||0),factor:Number(q.factor||1),label:q.label||factorLabel(q.factor||1),paidAmount:0,depositAmount:0};openFinish({mode:'queue',queue:q,appointment:temp})}
function openFinish(ctx){const a=ctx.appointment,s=service(a.serviceId),rows=materialRowsFor(a.serviceId,a.factor||1),already=Number(a.paidAmount||0),remaining=Math.max(0,Number(a.price||0)-already);modal('Finalizar trabajo',`<div class="card"><div class="rowTitle">${esc(client(a.clientId)?.name||a.walkInName||'Cliente')}</div><div class="rowSub">${esc(s?.name||'Servicio')} · precio ${money(a.price)}</div>${already>0?`<div class="rowSub goodText">Ya cobrado / seña: ${money(already)} · saldo ${money(remaining)}</div>`:''}</div>${finishMaterialsHtml(rows)}${remaining>0?`<label class="field"><span>Estado del saldo</span><select id="mPayStatus"><option value="paid">Cobrar saldo completo (${money(remaining)})</option><option value="pending">Dejar saldo pendiente</option><option value="partial">Cobro parcial</option></select></label><div id="partialBox" style="display:none"><label class="field"><span>Monto a cobrar ahora</span><input id="mPaid" type="number" min="0" max="${remaining}" value="0"></label></div><label class="field"><span>Cuenta donde entra</span><select id="mAccount">${accountOptions()}</select></label>`:`<div class="installHint" style="margin-top:11px">El trabajo ya está completamente cobrado.</div><input id="mPayStatus" type="hidden" value="already"><input id="mAccount" type="hidden" value="a1">`}<button class="btn dark full" id="mSave">Finalizar</button>`);const pay=$('#mPayStatus'),box=$('#partialBox');if(pay&&box)pay.onchange=()=>{box.style.display=pay.value==='partial'?'block':'none'};$('#mSave').onclick=()=>saveFinish(ctx)}
function saveFinish(ctx){const a=ctx.appointment,price=Number(a.price||0),already=Number(a.paidAmount||0),remaining=Math.max(0,price-already),payStatus=$('#mPayStatus').value;let nowPaid=payStatus==='paid'?remaining:payStatus==='partial'?Number($('#mPaid').value||0):0;if(nowPaid<0||nowPaid>remaining)return alert('Revisá el monto cobrado.');const rows=[...document.querySelectorAll('.finishQty')].map(el=>{const i=inv(el.dataset.inv);return {inventoryId:el.dataset.inv,name:i?.name||'Insumo',unit:i?.unit||'',qty:Number(el.value||0),costUnit:Number(i?.costUnit||0)}});for(const r of rows){const i=inv(r.inventoryId);if(i)i.stock=Math.max(0,Number(i.stock)-Number(r.qty))}const total=rows.reduce((s,r)=>s+Number(r.qty)*Number(r.costUnit),0);let effectiveClientId=a.clientId||null;if(ctx.mode==='queue'&&!effectiveClientId){const created=newClientRecord(a.walkInName||ctx.queue.name||'Cliente',ctx.queue.phone||'');if(!created)return alert('No pude crear el cliente del walk-in.');effectiveClientId=created.id;a.clientId=created.id;ctx.queue.clientId=created.id;ctx.queue.name=''}const log={id:id('log'),date:a.date||TODAY,appointmentId:ctx.mode==='appointment'?a.id:null,clientId:effectiveClientId,serviceId:a.serviceId,rows,total};data.logs.unshift(log);let finalAp;if(ctx.mode==='appointment'){finalAp=data.appointments.find(x=>x.id===a.id);finalAp.status='completed';finalAp.consumed=true;finalAp.consumptionRows=rows;finalAp.paidAmount=already+nowPaid;finalAp.paymentStatus=finalAp.paidAmount>=price?'paid':finalAp.paidAmount>0?'partial':'pending';finalAp.accountId=$('#mAccount').value||finalAp.accountId||'a1'}else{finalAp={id:id('ap'),clientId:effectiveClientId,walkInName:'',serviceId:a.serviceId,date:TODAY,time:a.time,status:'completed',price,factor:a.factor,label:a.label,consumed:true,consumptionRows:rows,paidAmount:nowPaid,depositAmount:0,paymentStatus:nowPaid>=price?'paid':nowPaid>0?'partial':'pending',accountId:$('#mAccount').value||'a1',walkIn:true,note:ctx.queue?.note||'',waConfirmSentAt:'',waReminderSentAt:''};data.appointments.push(finalAp);ctx.queue.status='done'}log.appointmentId=finalAp.id;if(nowPaid>0)data.txns.unshift({id:id('t'),clientId:effectiveClientId,appointmentId:finalAp.id,source:'service',type:'income',cat:'Servicio',amount:nowPaid,accountId:$('#mAccount').value,date:TODAY,desc:service(finalAp.serviceId)?.name||'Servicio'});save();closeModal();render()}
function openCollect(apId){const a=data.appointments.find(x=>x.id===apId);if(!a)return;const balance=Math.max(0,Number(a.price)-Number(a.paidAmount||0));modal('Cobrar saldo',`<div class="info">Saldo pendiente: <b>${money(balance)}</b>${Number(a.depositAmount||0)>0?` · seña registrada ${money(a.depositAmount)}`:''}</div><label class="field"><span>Monto a cobrar</span><input id="mAmount" type="number" min="0" max="${balance}" value="${balance}"></label><label class="field"><span>Cobrado en</span><select id="mAccount">${accountOptions()}</select></label><button class="btn dark full" id="mSave">Registrar cobro</button>`);$('#mSave').onclick=()=>{const amount=Number($('#mAmount').value);if(!amount||amount>balance)return alert('Revisá el monto.');data.txns.unshift({id:id('t'),clientId:a.clientId||null,appointmentId:a.id,source:'collection',type:'income',cat:'Servicio',amount,accountId:$('#mAccount').value,date:TODAY,desc:`Saldo ${service(a.serviceId)?.name||'Servicio'}`});a.paidAmount=Number(a.paidAmount||0)+amount;a.paymentStatus=a.paidAmount>=Number(a.price)?'paid':'partial';save();closeModal();render()}}

 if(a.status==='completed')return alert('Los trabajos realizados quedan bloqueados para conservar pagos, historial y consumo de materiales.');

 $('#mSave').onclick=()=>{const cid=$('#mClient').value,sid=$('#mService').value,date=$('#mDate').value,time=$('#mTime').value,f=Number($('#mFactor').value),newPrice=Number(service(sid)?.price||a.price||0);if(!cid||!sid||!date)return alert('Completá cliente, servicio y fecha.');if(Number(a.paidAmount||0)>newPrice)return alert('Ese servicio cuesta menos de lo que ya fue cobrado/señado. Ajustá primero el movimiento de plata.');a.clientId=cid;a.serviceId=sid;a.date=date;a.time=time;a.factor=f;a.label=factorLabel(f);a.price=newPrice;a.note=$('#mNote').value.trim();if(['cancelled','no_show'].includes(a.status))a.status='pending';agendaDate=date;save();closeModal();render()}

function openAppointmentWhatsApp(apId){const a=data.appointments.find(x=>x.id===apId),c=client(a?.clientId);if(!a||!c)return;if(!c.phone)return alert('Este cliente no tiene teléfono cargado.');modal('WhatsApp · '+c.name,`<div class="card"><div class="rowTitle">${esc(service(a.serviceId)?.name||'Servicio')}</div><div class="rowSub">${fullDate(a.date)} · ${esc(appointmentTimeLabel(a))}</div></div><div class="btnRow"><button class="btn green full" id="mWaConfirm">${a.waConfirmSentAt?'Reenviar confirmación':'Enviar confirmación'}</button><button class="btn green full" id="mWaReminder">${String(a.waReminderSentAt||'').startsWith(TODAY)?'Reenviar recordatorio':'Enviar recordatorio'}</button></div>${a.waConfirmSentAt?`<div class="note">Confirmación preparada anteriormente.</div>`:''}${a.waReminderSentAt?`<div class="note">Recordatorio preparado anteriormente.</div>`:''}`);$('#mWaConfirm').onclick=()=>sendAppointmentWhatsApp(apId,'confirmation');$('#mWaReminder').onclick=()=>sendAppointmentWhatsApp(apId,'reminder')}
function deleteAppointment(apId){const a=data.appointments.find(x=>x.id===apId);if(!a)return;if(a.status==='completed')return alert('Un trabajo realizado no se elimina porque tiene historial de materiales y/o pagos.');if(confirm('¿Eliminar este turno definitivamente?')){data.appointments=data.appointments.filter(x=>x.id!==apId);save();render()}}

function compatibleWaiters(a){return data.wait.filter(w=>{if(w.date&&w.date!==a.date)return false;if(!a.time&&(w.from||w.to))return false;if(w.from&&a.time<w.from)return false;if(w.to&&a.time>w.to)return false;if(w.serviceId&&w.serviceId!==a.serviceId)return false;return true})}
function cancelAppointment(apId){const a=data.appointments.find(x=>x.id===apId);if(!a)return;a.status='cancelled';save();render();const matches=compatibleWaiters(a);openFreedSlot(a,matches)}
function openFreedSlot(a,matches){modal('Turno liberado',`<div class="slotFreed"><b>${short(a.date)} · ${esc(appointmentTimeLabel(a))}</b><br>${esc(service(a.serviceId)?.name||'Servicio')} quedó disponible.</div>${matches.length?`<div class="recipeTitle" style="margin-top:13px">${matches.length} persona${matches.length===1?'':'s'} compatible${matches.length===1?'':'s'} en lista de espera</div>${matches.map(w=>{const c=client(w.clientId);return `<div class="waitMatch"><div class="rowTitle">${esc(c?.name||'Cliente')}</div><div class="rowSub">${esc(w.pref||'Coincide con este horario')}</div><div class="btnRow"><button class="btn amber" data-assign-wait="${w.id}" data-slot="${a.id}">Dar este turno</button>${c?.phone?`<button class="btn green" data-wa-slot="${w.id}">WhatsApp</button>`:''}</div></div>`}).join('')}`:`<div class="info" style="margin-top:12px">No hay personas compatibles en la lista de espera para este horario. El turno quedó cancelado.</div>`}<button class="btn gray full" style="margin-top:12px" id="mDone">Cerrar</button>`);$('#mDone').onclick=closeModal;document.querySelectorAll('[data-assign-wait]').forEach(b=>b.onclick=()=>assignWaiterToSlot(b.dataset.slot,b.dataset.assignWait));document.querySelectorAll('[data-wa-slot]').forEach(b=>b.onclick=()=>{const w=data.wait.find(x=>x.id===b.dataset.waSlot),c=client(w?.clientId);if(c)whatsapp(c.phone,`Hola ${c.name} 😊 Se liberó un turno el ${short(a.date)}${a.time?` a las ${a.time}`:', con horario a definir'}. ¿Querés tomarlo?`)})}
function assignWaiterToSlot(cancelledId,wId){const slot=data.appointments.find(x=>x.id===cancelledId),w=data.wait.find(x=>x.id===wId);if(!slot||!w)return;const sid=w.serviceId||slot.serviceId,srv=service(sid),apId=id('ap');data.appointments.push({id:apId,clientId:w.clientId,serviceId:sid,date:slot.date,time:slot.time,status:'pending',price:Number(srv?.price||0),factor:1,label:'Normal',consumed:false,paidAmount:0,depositAmount:0,paymentStatus:'pending',note:w.pref||'',waConfirmSentAt:'',waReminderSentAt:''});data.wait=data.wait.filter(x=>x.id!==wId);agendaDate=slot.date;save();closeModal();render();openAppointmentSaved(apId)}
function setAp(apId,status){const a=data.appointments.find(x=>x.id===apId);if(!a)return;if(status==='cancelled')return cancelAppointment(apId);a.status=status;save();render()}

 document.querySelectorAll('[data-mark-follow]').forEach(b=>b.onclick=()=>{markFollowUpContact(b.dataset.markFollow);render()});
 document.querySelectorAll('[data-wa-ap]').forEach(b=>b.onclick=()=>openAppointmentWhatsApp(b.dataset.waAp));
 document.querySelectorAll('[data-wa-reminder]').forEach(b=>b.onclick=()=>sendAppointmentWhatsApp(b.dataset.waReminder,'reminder'));
 document.querySelectorAll('[data-wa-balance]').forEach(b=>b.onclick=()=>sendBalanceWhatsApp(b.dataset.waBalance));
 document.querySelectorAll('[data-ack-cost]').forEach(b=>b.onclick=()=>{const i=inv(b.dataset.ackCost);if(i?.costChange){i.costChange.ack=true;save();render()}});
 document.querySelectorAll('[data-wa-client]').forEach(b=>b.onclick=()=>{const c=client(b.dataset.waClient);if(c)whatsapp(c.phone,`Hola ${c.name} 😊`)});
 document.querySelectorAll('[data-edit-client]').forEach(b=>b.onclick=()=>openClientModal(b.dataset.editClient));
 document.querySelectorAll('[data-edit-service]').forEach(b=>b.onclick=()=>openServiceModal(b.dataset.editService));
 document.querySelectorAll('[data-delete-service]').forEach(b=>b.onclick=()=>deleteService(b.dataset.deleteService));
 document.querySelectorAll('[data-edit-inventory]').forEach(b=>b.onclick=()=>openInventoryModal(b.dataset.editInventory));
 document.querySelectorAll('[data-delete-inventory]').forEach(b=>b.onclick=()=>deleteInventory(b.dataset.deleteInventory));
 document.querySelectorAll('[data-restock]').forEach(b=>b.onclick=()=>openRestock(b.dataset.restock));
 document.querySelectorAll('[data-collect]').forEach(b=>b.onclick=()=>openCollect(b.dataset.collect));
 document.querySelectorAll('[data-edit-txn]').forEach(b=>b.onclick=()=>openEditTxn(b.dataset.editTxn));
 document.querySelectorAll('[data-delete-txn]').forEach(b=>b.onclick=()=>deleteTxn(b.dataset.deleteTxn));
 document.querySelectorAll('[data-agenda]').forEach(b=>b.onclick=()=>{agendaDate=b.dataset.agenda==='today'?TODAY:tomorrow();render()});
 const ad=$('#agendaDate');if(ad)ad.onchange=()=>{if(ad.value){agendaDate=ad.value;render()}};
 document.querySelectorAll('[data-report-period]').forEach(b=>b.onclick=()=>{reportPeriod=b.dataset.reportPeriod;render()});
 document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));

 const obSave=$('#obSave');if(obSave)obSave.onclick=()=>{const c=onlineCfg(),days=[...document.querySelectorAll('[data-ob-day]:checked')].map(x=>Number(x.dataset.obDay));if(!days.length)return alert('Elegí al menos un día habilitado.');const open=$('#obOpen').value,close=$('#obClose').value;if(!open||!close||open>=close)return alert('Revisá el horario de apertura y cierre.');c.enabled=$('#obEnabled').value==='1';c.slug=cleanSlug($('#obSlug').value);c.publicBaseUrl=$('#obBase').value.trim();c.backendUrl=cleanBackend($('#obBackend').value);c.openTime=open;c.closeTime=close;c.slotStep=Math.max(5,Number($('#obStep').value||15));c.minAdvanceHours=Math.max(0,Number($('#obMin').value||0));c.maxAdvanceDays=Math.max(1,Number($('#obMax').value||30));c.approvalMode=$('#obApproval').value;c.workingDays=days;c.telegramEnabled=$('#obTelegram').value==='1';c.telegramChatId=$('#obChat').value.trim();save();render();if(c.backendUrl)syncOnlineBusiness(false)};
 const obCopy=$('#obCopy');if(obCopy)obCopy.onclick=copyBookingLink;const obSync=$('#obSync');if(obSync)obSync.onclick=()=>syncOnlineBusiness(true);const obPull=$('#obPull');if(obPull)obPull.onclick=()=>pullOnlineBookings(true);
 const eb=document.querySelector('[data-edit-business]');if(eb)eb.onclick=openBusinessModal;
 const s=$('#search');if(s)s.oninput=()=>{const q=s.value.trim().toLowerCase(),qd=phoneDigits(q);$('#clientList').innerHTML=clientRows(data.clients.filter(c=>c.name.toLowerCase().includes(q)||(qd&&phoneDigits(c.phone).includes(qd))));document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>{selected=b.dataset.client;tab='clients';render();pushAppState()})};
 const bk=$('#backup');if(bk)bk.onclick=backup;const rs=$('#restore');if(rs)rs.onchange=restore;const r=$('#reset');if(r)r.onclick=()=>{if(confirm('¿Reiniciar la demo y borrar los cambios de prueba?')){data=fresh();applyTheme();save();selected=null;agendaDate=TODAY;render()}};
 const ia=$('#installApp');if(ia)ia.onclick=installApp;
}
function backup(){const blob=new Blob([JSON.stringify({version:6,profile:'barber',exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`mi-negocio-respaldo-${TODAY}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restore(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{data=migrate(JSON.parse(rd.result));applyTheme();save();selected=null;render();alert('Respaldo restaurado.')}catch(_){alert('No pude leer ese respaldo.')}};rd.readAsText(f)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;render()});
async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;render();return}if(window.matchMedia('(display-mode: standalone)').matches)return alert('La aplicación ya está instalada.');alert('Si no aparece la opción automática, usá el menú del navegador y elegí “Instalar aplicación” o “Agregar a pantalla de inicio”.')}
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js');await reg.update();let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload()})}catch(e){}})}
window.addEventListener('popstate',e=>{const st=e.state;if($('#modal').innerHTML)$('#modal').innerHTML='';if(st?.miNegocio){tab=st.tab||'today';sub=st.sub||'appointments';selected=st.selected||null;agendaDate=st.agendaDate||TODAY;render()}});
if(location.protocol!=='file:')history.replaceState(appHistoryState(),'',location.href);

window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{data=migrate(JSON.parse(e.newValue));applyTheme();render()}catch(_){}}});
setTimeout(()=>{const c=onlineCfg();if(c.enabled&&c.backendUrl){pullOnlineBookings(false);syncOnlineBusiness(false)}},1200);
setInterval(()=>{const c=onlineCfg();if(c.enabled&&c.backendUrl&&document.visibilityState==='visible')pullOnlineBookings(false)},60000);
applyTheme();
render();
})();
