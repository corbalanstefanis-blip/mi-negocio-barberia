<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservar turno</title>
<meta name="theme-color" content="#203F68">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--pearl:#ECEAE5;--red:#BE3C33;--navy:#203F68;--bg:#090A0A;--card:#191C1D;--ink:#F7F7F4;--soft:#B5BAC0;--line:#454B50;--ok:#1E3029;--okText:#BFE5CF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,#fff 24px 36px,var(--navy) 36px 60px,#fff 60px 72px)}.wrap{max-width:560px;margin:0 auto;padding:24px 18px 46px}.brand{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.06em}h1{font-family:"Fraunces",Georgia,serif;font-size:34px;font-weight:600;line-height:1.02;margin:5px 0 6px}h2{font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:600;margin:0 0 12px}.lead{color:var(--soft);font-size:13px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.field{display:block;margin:12px 0}.field span{display:block;font-size:11px;color:var(--soft);font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#111314;color:var(--ink);font-size:16px}.field textarea{min-height:80px}.serviceGrid{display:grid;gap:9px}.service{border:1px solid var(--line);background:#17191A;color:var(--ink);border-radius:15px;padding:13px;text-align:left}.service.active{border-color:var(--pearl);box-shadow:0 0 0 1px var(--pearl)}.service b{display:block;font-size:14px}.service small{display:block;color:var(--soft);margin-top:4px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:1px solid var(--line);background:#17191A;color:var(--ink);border-radius:999px;padding:11px 5px;font-weight:800}.slot.active{background:var(--pearl);border-color:var(--pearl);color:#101214;box-shadow:0 8px 20px rgba(236,234,229,.18)}.slot small{display:block;font-size:9px;font-weight:600;margin-top:2px;opacity:.78}.btn{width:100%;border:0;border-radius:999px;padding:14px;background:var(--pearl);color:#101214;font-size:14px;font-weight:800}.btn:disabled{opacity:.38}.info{background:#222A31;border:1px solid #3B4854;color:#D7E0E8;border-radius:14px;padding:12px;font-size:12px;line-height:1.45}.success{background:var(--ok);color:var(--okText);border:1px solid #315244;border-radius:18px;padding:18px}.error{background:#382323;color:#F0B0AC;border:1px solid #65403E;border-radius:14px;padding:12px;font-size:12px}.hidden{display:none}.summary{font-size:12px;line-height:1.5}.summary b{font-size:14px}.mode{font-size:10px;color:var(--soft);margin-top:12px;text-align:center}.loading{padding:18px;text-align:center;color:var(--soft)}

/* PORTAL PREMIUM BARBERÍA CENTRAL — capa exclusivamente visual */
:root{--pearl:#e9edf1;--red:#b53640;--navy:#1e639e;--bg:#05090d;--card:#0e1922;--ink:#f2f5f8;--soft:#aabac7;--line:#314350;--ok:#12362f;--okText:#b2f0d7;--metal-blue:linear-gradient(145deg,#b8e9ff 0%,#3d9cdd 18%,#07528d 47%,#082f57 73%,#73c6f4 100%);--metal-silver:linear-gradient(140deg,#fafafa 0%,#b8c0c9 19%,#677684 49%,#e4e9ee 75%,#83919e 100%);--metal-red:linear-gradient(145deg,#ffb2b0 0%,#d64b50 20%,#7c1d2d 53%,#bc3947 77%,#ff9da1 100%)}
html{background:var(--bg)}
body{min-height:100vh;background:radial-gradient(ellipse 95% 430px at 50% -170px,rgba(38,104,151,.31),transparent 78%),radial-gradient(ellipse 60% 350px at 100% 40%,rgba(6,51,83,.18),transparent),var(--bg)}
.top{height:3px;background:linear-gradient(90deg,#081e30,#4e9ac8 21%,#e8eef3 43%,#912b37 65%,#f19c9e 83%,#1b3f63);box-shadow:0 2px 12px rgba(89,155,205,.23)}
.wrap{max-width:520px;padding:32px 18px 62px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.19em;color:#b9cbd7;margin:0 0 12px}
.brand:before{content:"";width:23px;height:23px;display:inline-block;border-radius:8px;background:var(--metal-silver);box-shadow:inset 0 1px 0 #fff,0 3px 12px rgba(166,202,230,.15)}
h1{font-family:"Fraunces",Georgia,serif;font-size:clamp(31px,7vw,42px);font-weight:600;line-height:1.09;letter-spacing:-.7px;margin:0 0 10px;text-shadow:0 3px 24px rgba(0,0,0,.4)}
h2{font-family:"Inter",system-ui,sans-serif;font-size:15px;font-weight:800;letter-spacing:-.2px;margin-bottom:16px}
.lead{font-size:13px;line-height:1.65;max-width:390px;margin-bottom:27px;color:#b8c5d0}
.card{position:relative;background:linear-gradient(150deg,rgba(75,109,134,.17),transparent 38%),linear-gradient(165deg,#17242e,#0c151c 70%);border:1px solid #344856;border-radius:20px;padding:20px;margin:15px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 12px 35px rgba(0,0,0,.27)}
.card h2{display:flex;align-items:center;gap:10px}
.card h2:first-letter{color:#92d3f8}
.serviceGrid{gap:10px}
.service{position:relative;overflow:hidden;background:linear-gradient(155deg,#202f3a,#111b23 65%,#0e151b);border:1px solid #3c5260;border-radius:14px;padding:17px 16px;min-height:72px;box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 5px 12px rgba(0,0,0,.15);transition:border-color .15s,transform .15s,box-shadow .15s}
.service:after{content:"›";position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:400;color:#7c9cb2}
.service b{font-size:14px;max-width:85%;line-height:1.4}
.service small{font-size:11px;margin-top:7px;color:#aebfcc;line-height:1.4}
.service.active{border-color:#78c8fa;background:linear-gradient(145deg,#23455f,#11263a 70%,#0e1926);box-shadow:inset 0 1px rgba(255,255,255,.22),0 0 0 1px rgba(76,160,221,.38),0 8px 22px rgba(8,70,119,.19)}
.service.active:after{color:#b3e6ff}
.field{margin:13px 0}.field span{font-size:11px;letter-spacing:.025em;margin-bottom:8px;color:#c3ced8}
.field input,.field select,.field textarea{background:linear-gradient(160deg,#17242e,#0d161d);border:1px solid #3b4f5e;border-radius:12px;color:#f4f6f8;padding:13px;box-shadow:inset 0 1px 3px rgba(0,0,0,.22);outline-offset:2px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#70c1f0;outline:2px solid rgba(65,150,207,.25)}
.field input[type="date"]{color-scheme:dark}
.slots{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.slot{border-radius:11px;padding:13px 4px;background:linear-gradient(150deg,#1c2a35,#0d1720);border-color:#415462;font-size:13px;box-shadow:inset 0 1px rgba(255,255,255,.08)}
.slot.active{background:var(--metal-blue);border-color:#8dd7ff;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:inset 0 1px rgba(255,255,255,.5),0 7px 18px rgba(12,88,145,.28)}
.slot small{font-size:9px;line-height:1.4}
.btn{border-radius:12px;background:var(--metal-blue);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);border:1px solid #66b9e8;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px rgba(10,68,109,.27);min-height:48px}
.btn:disabled{opacity:.4;box-shadow:none}
.info{background:#142635;border:1px solid #365368;color:#c4d9e8;border-radius:12px;line-height:1.6}
.success{background:linear-gradient(145deg,#16483b,#0b201d);border-color:#4a9b7f;box-shadow:0 12px 35px rgba(0,0,0,.3);color:#d1ffe9;padding:24px}
.error{border-radius:12px}
.summary{padding:13px 14px;margin:14px 0;background:#152735;border:1px solid #385568;border-radius:12px;color:#c9deed}
.mode{font-size:10px;letter-spacing:.03em;color:#8397a5;margin-top:20px}
button{cursor:pointer}button:focus-visible{outline:2px solid #a9dfff;outline-offset:3px}
@media(min-width:700px){.wrap{padding-top:55px}.card{padding:24px}}
@media(prefers-reduced-motion:reduce){.service{transition:none}}

</style>
</head>
<body><div class="top"></div><main class="wrap"><div id="app"><div class="loading">Cargando agenda…</div></div></main>
<script>
(()=>{'use strict';
const KEY='mi-negocio-barberia-v4';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const DEFAULT_API='https://mi-negocio-reservas.corbalanstefanis.workers.dev';
const params=new URLSearchParams(location.search),slug=params.get('b')||'mi-barberia',api=(params.get('api')||DEFAULT_API).replace(/\/+$/,'');
const pad=n=>String(n).padStart(2,'0'),iso=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=iso();
let cfg=null,selectedService='',selectedDate=today,selectedTime='',slots=[];
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));
const toMin=t=>{const [h,m]=String(t||'00:00').split(':').map(Number);return h*60+m},fromMin=n=>`${pad(Math.floor(n/60))}:${pad(n%60)}`;
function localData(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function localConfig(){const d=localData();if(!d)return null;const ob=d.settings?.onlineBookings||{};return {slug:ob.slug||slug,businessName:d.settings?.businessName||'Barbería',bookingSettings:{enabled:Boolean(ob.enabled),openTime:ob.openTime||'09:00',closeTime:ob.closeTime||'19:00',slotStep:Number(ob.slotStep||15),minAdvanceHours:Number(ob.minAdvanceHours||0),maxAdvanceDays:Number(ob.maxAdvanceDays||30),approvalMode:ob.approvalMode||'auto',workingDays:Array.isArray(ob.workingDays)?ob.workingDays:[1,2,3,4,5,6]},services:(d.services||[]).map(s=>({id:s.id,name:s.name,duration:Number(s.duration||30),price:Number(s.price||0),onlineEnabled:s.onlineEnabled!==false,allowOverbook:Boolean(s.allowOverbook),maxConcurrent:Math.max(1,Number(s.maxConcurrent||1))}))}}
async function loadConfig(){if(api){const r=await fetch(`${api}/api/public-config?slug=${encodeURIComponent(slug)}`);if(!r.ok)throw new Error('No se pudo cargar esta agenda.');return r.json()}const c=localConfig();if(!c)throw new Error('Esta página todavía no está conectada a una agenda pública.');return c}
function selectedSrv(){return cfg?.services?.find(s=>s.id===selectedService)}
function overlaps(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&bStart<aEnd}
function localAvailability(){const d=localData(),s=selectedSrv(),bs=cfg.bookingSettings;if(!d||!s)return[];const dateObj=new Date(selectedDate+'T00:00:00'),dow=dateObj.getDay();if(!(bs.workingDays||[]).map(Number).includes(dow))return[];const start=toMin(bs.openTime),close=toMin(bs.closeTime),step=Number(bs.slotStep||15),duration=Number(s.duration||30),existing=(d.appointments||[]).filter(a=>a.date===selectedDate&&a.time&&['pending','confirmed'].includes(a.status));const now=Date.now(),minTime=now+Number(bs.minAdvanceHours||0)*3600000;const out=[];for(let t=start;t+duration<=close;t+=step){const when=new Date(selectedDate+'T'+fromMin(t)+':00').getTime();if(when<minTime)continue;const overlapping=existing.filter(a=>{const es=(d.services||[]).find(x=>x.id===a.serviceId),as=toMin(a.time),ae=as+Number(es?.duration||30);return overlaps(t,t+duration,as,ae)});let ok=overlapping.length===0,overbook=false;if(overlapping.length){if(s.allowOverbook&&overlapping.every(a=>Boolean((d.services||[]).find(x=>x.id===a.serviceId)?.allowOverbook))){const limits=[Math.max(1,Number(s.maxConcurrent||1)),...overlapping.map(a=>Math.max(1,Number((d.services||[]).find(x=>x.id===a.serviceId)?.maxConcurrent||1)))];const limit=Math.min(...limits);ok=overlapping.length<limit;overbook=ok}}if(ok)out.push({time:fromMin(t),end:fromMin(t+duration),overbook})}return out}
async function loadSlots(){selectedTime='';if(!selectedService||!selectedDate){slots=[];render();return}try{if(api){const r=await fetch(`${api}/api/availability?slug=${encodeURIComponent(slug)}&date=${encodeURIComponent(selectedDate)}&serviceId=${encodeURIComponent(selectedService)}`);if(!r.ok)throw new Error(await r.text());const j=await r.json();slots=j.slots||[]}else slots=localAvailability();render()}catch(e){slots=[];render(String(e.message||e))}}
function maxDate(){const d=new Date();d.setDate(d.getDate()+Number(cfg?.bookingSettings?.maxAdvanceDays||30));return iso(d)}
function nextWorkingDate(from=selectedDate){
 const allowed=(cfg?.bookingSettings?.workingDays||[]).map(Number),limit=Number(cfg?.bookingSettings?.maxAdvanceDays||30),d=new Date(from+'T00:00:00');
 for(let i=1;i<=Math.min(limit,14);i++){d.setDate(d.getDate()+1);if(allowed.includes(d.getDay()))return iso(d)}
 return '';
}
function noSlotsText(){
 const bs=cfg?.bookingSettings||{},advance=Number(bs.minAdvanceHours||0);
 if(selectedDate===today)return `Por hoy no quedan horarios reservables según el horario del local${advance>0?` y la anticipación mínima de ${advance===1?'1 hora':advance+' horas'}`:''}. Elegí otra fecha.`;
 return 'No quedan horarios libres para esta fecha.';
}
function render(err=''){const services=(cfg?.services||[]).filter(s=>s.onlineEnabled!==false),srv=selectedSrv(),bs=cfg?.bookingSettings||{};$('#app').innerHTML=`<div class="brand">Reserva online</div><h1>${esc(cfg?.businessName||'Barbería')}</h1><div class="lead">Elegí el servicio y un horario disponible. No necesitás instalar ninguna aplicación.</div>${!bs.enabled?'<div class="error">Las reservas online están desactivadas temporalmente.</div>':''}${err?`<div class="error">${esc(err)}</div>`:''}<section class="card"><h2>1. Servicio</h2><div class="serviceGrid">${services.map(s=>`<button class="service ${selectedService===s.id?'active':''}" data-srv="${s.id}"><b>${esc(s.name)}</b><small>${s.duration} min · ${money(s.price)}${s.allowOverbook?' · admite sobreturno':''}</small></button>`).join('')||'<div class="info">No hay servicios disponibles para reservar online.</div>'}</div></section><section class="card"><h2>2. Día y horario</h2><label class="field"><span>Fecha</span><input id="date" type="date" min="${today}" max="${maxDate()}" value="${selectedDate}"></label>${selectedService?`<div class="slots">${slots.map(x=>`<button class="slot ${selectedTime===x.time?'active':''}" data-time="${x.time}">${x.time}<small>hasta ${x.end}${x.overbook?' · sobreturno':''}</small></button>`).join('')}</div>${!slots.length?`<div class="info">${esc(noSlotsText())}</div>${nextWorkingDate()?'<button id="nextDay" class="btn" style="margin-top:9px;background:#eef1f4;color:#203F68">Ver próximo día</button>':''}`:''}`:'<div class="info">Primero elegí un servicio.</div>'}</section><section class="card"><h2>3. Tus datos</h2><label class="field"><span>Nombre</span><input id="name" autocomplete="name"></label><label class="field"><span>WhatsApp / teléfono</span><input id="phone" inputmode="tel" autocomplete="tel"></label><label class="field"><span>Nota (opcional)</span><textarea id="note" placeholder="Algo que el barbero necesite saber sobre este turno"></textarea></label>${srv&&selectedTime?`<div class="summary"><b>${esc(srv.name)} · ${selectedDate} · ${selectedTime}</b><br>Duración estimada: ${srv.duration} minutos · finaliza aprox. ${slots.find(x=>x.time===selectedTime)?.end||''}</div>`:''}<button id="submit" class="btn" ${!bs.enabled||!selectedService||!selectedTime?'disabled':''}>Reservar turno</button></section><div class="mode">${api?'Agenda online':'Modo demo local · para usar desde otro celular hay que conectar el backend'}</div>`;document.querySelectorAll('[data-srv]').forEach(b=>b.onclick=()=>{selectedService=b.dataset.srv;loadSlots()});const di=$('#date');if(di)di.onchange=()=>{selectedDate=di.value;loadSlots()};const nd=$('#nextDay');if(nd)nd.onclick=()=>{const next=nextWorkingDate();if(next){selectedDate=next;loadSlots()}};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{selectedTime=b.dataset.time;render()});const sb=$('#submit');if(sb)sb.onclick=submitBooking}
function localSubmit(body){const d=localData();if(!d)throw new Error('No se encontró la agenda local.');let c=(d.clients||[]).find(x=>String(x.phone||'').replace(/\D/g,'')===String(body.clientPhone||'').replace(/\D/g,'')&&body.clientPhone);if(!c){c={id:'c'+Date.now(),name:body.clientName,phone:body.clientPhone,freq:30,tech:{},followUpContactedFor:'',followUpContactedAt:''};d.clients=(d.clients||[]);d.clients.unshift(c)}const s=(d.services||[]).find(x=>x.id===body.serviceId),status=(d.settings?.onlineBookings?.approvalMode||'auto')==='auto'?'confirmed':'pending';d.appointments=(d.appointments||[]);d.appointments.push({id:'ap'+Date.now(),clientId:c.id,serviceId:body.serviceId,date:body.date,time:body.time,status,price:Number(s?.price||0),factor:1,label:'Normal',consumed:false,paidAmount:0,depositAmount:0,paymentStatus:'pending',note:body.note||'',waConfirmSentAt:'',waReminderSentAt:'',source:'online',onlineBookingId:'local-'+Date.now(),requestedAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(d));return {status}}
let bookingSubmitting=false;
async function submitBooking(){if(bookingSubmitting)return;const name=$('#name').value.trim(),phone=$('#phone').value.trim(),note=$('#note').value.trim();if(!name||!phone)return alert('Completá nombre y teléfono.');const body={slug,serviceId:selectedService,date:selectedDate,time:selectedTime,clientName:name,clientPhone:phone,note};bookingSubmitting=true;const submitButton=$('#submit');if(submitButton){submitButton.disabled=true;submitButton.textContent='Reservando...'}try{let result;if(api){const r=await fetch(api+'/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());result=await r.json()}else result=localSubmit(body);const srv=selectedSrv();$('#app').innerHTML=`<div class="success"><h2 style="margin-top:0">${result.status==='confirmed'?'Turno confirmado':'Solicitud enviada'}</h2><div>${esc(name)}, reservaste <b>${esc(srv?.name||'servicio')}</b> para el <b>${esc(selectedDate)}</b> a las <b>${esc(selectedTime)}</b>.</div>${result.status!=='confirmed'?'<div style="margin-top:8px">La barbería debe confirmar el turno.</div>':''}</div><button class="btn" style="margin-top:14px" onclick="location.reload()">Reservar otro turno</button>`}catch(e){bookingSubmitting=false;alert('No se pudo reservar: '+String(e.message||e));await loadSlots()}}
loadConfig().then(c=>{cfg=c;selectedService=(c.services||[]).find(s=>s.onlineEnabled!==false)?.id||'';const bs=c.bookingSettings||{};const md=new Date();if(!(bs.workingDays||[]).map(Number).includes(md.getDay())){for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()+i);if((bs.workingDays||[]).map(Number).includes(d.getDay())){selectedDate=iso(d);break}}}loadSlots()}).catch(e=>{$('#app').innerHTML=`<div class="error">${esc(e.message||e)}</div>`});
})();
</script></body></html>
