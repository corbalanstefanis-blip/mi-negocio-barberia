<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservar turno</title>
<meta name="theme-color" content="#203F68">
<style>
:root{--blue:#203F68;--red:#BE3C33;--bg:#F6F3ED;--card:#fff;--ink:#171717;--soft:#6c6862;--line:#e4ded4;--ok:#e7f3ec;--okText:#1d6b47}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,#fff 24px 36px,var(--blue) 36px 60px,#fff 60px 72px)}.wrap{max-width:560px;margin:0 auto;padding:24px 18px 46px}.brand{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.06em}h1{font-size:30px;margin:5px 0 4px}h2{font-size:17px;margin:0 0 12px}.lead{color:var(--soft);font-size:13px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.field{display:block;margin:12px 0}.field span{display:block;font-size:11px;color:var(--soft);font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;font-size:16px}.field textarea{min-height:80px}.serviceGrid{display:grid;gap:9px}.service{border:2px solid var(--line);background:#fff;border-radius:15px;padding:13px;text-align:left}.service.active{border-color:var(--blue);box-shadow:0 0 0 2px #203f6815}.service b{display:block;font-size:14px}.service small{display:block;color:var(--soft);margin-top:4px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 5px;font-weight:800}.slot.active{background:var(--blue);border-color:var(--blue);color:#fff}.slot small{display:block;font-size:9px;font-weight:600;margin-top:2px;opacity:.78}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--blue);color:#fff;font-size:14px;font-weight:800}.btn:disabled{opacity:.45}.info{background:#eef4fa;border:1px solid #cbdbea;color:#274e78;border-radius:14px;padding:12px;font-size:12px;line-height:1.45}.success{background:var(--ok);color:var(--okText);border:1px solid #c8e1d4;border-radius:18px;padding:18px}.error{background:#faecea;color:#9b342d;border:1px solid #efcbc6;border-radius:14px;padding:12px;font-size:12px}.hidden{display:none}.summary{font-size:12px;line-height:1.5}.summary b{font-size:14px}.mode{font-size:10px;color:var(--soft);margin-top:12px;text-align:center}.loading{padding:18px;text-align:center;color:var(--soft)}
</style>
</head>
<body><div class="top"></div><main class="wrap"><div id="app"><div class="loading">Cargando agenda…</div></div></main>
<script>
(()=>{'use strict';
const KEY='mi-negocio-barberia-v4';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search),slug=params.get('b')||'mi-barberia',api=(params.get('api')||'').replace(/\/+$/,'');
const pad=n=>String(n).padStart(2,'0'),iso=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=iso();
let cfg=null,selectedService='',selectedDate=today,selectedTime='',slots=[];
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));
const toMin=t=>{const [h,m]=String(t||'00:00').split(':').map(Number);return h*60+m},fromMin=n=>`${pad(Math.floor(n/60))}:${pad(n%60)}`;
function localData(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function localConfig(){const d=localData();if(!d)return null;const ob=d.settings?.onlineBookings||{};return {slug:ob.slug||slug,businessName:d.settings?.businessName||'Barbería',bookingSettings:{enabled:Boolean(ob.enabled),openTime:ob.openTime||'09:00',closeTime:ob.closeTime||'19:00',slotStep:Number(ob.slotStep||15),minAdvanceHours:Number(ob.minAdvanceHours||0),maxAdvanceDays:Number(ob.maxAdvanceDays||30),approvalMode:ob.approvalMode||'auto',workingDays:Array.isArray(ob.workingDays)?ob.workingDays:[1,2,3,4,5,6]},services:(d.services||[]).map(s=>({id:s.id,name:s.name,duration:Number(s.duration||30),price:Number(s.price||0),onlineEnabled:s.onlineEnabled!==false,allowOverbook:Boolean(s.allowOverbook),maxConcurrent:Math.max(1,Number(s.maxConcurrent||1))}))}}
async function loadConfig(){if(api){const r=await fetch(`${api}/api/public-config?slug=${encodeURIComponent(slug)}`);if(!r.ok)throw new Error('No se pudo cargar esta agenda.');return r.json()}const c=localConfig();if(!c)throw new Error('Esta página todavía no está conectada a una agenda pública.');return c}
function selectedSrv(){return cfg?.services?.find(s=>s.id===selectedService)}
function overlaps(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&bStart<aEnd}
function localAvailability(){const d=localData(),s=selectedSrv(),bs=cfg.bookingSettings;if(!d||!s)return[];const dateObj=new Date(selectedDate+'T00:00:00'),dow=dateObj.getDay();if(!(bs.workingDays||[]).map(Number).includes(dow))return[];const start=toMin(bs.openTime),close=toMin(bs.closeTime),step=Number(bs.slotStep||15),duration=Number(s.duration||30),existing=(d.appointments||[]).filter(a=>a.date===selectedDate&&a.time&&['pending','confirmed'].includes(a.status));const now=Date.now(),minTime=now+Number(bs.minAdvanceHours||0)*3600000;const out=[];for(let t=start;t+duration<=close;t+=step){const when=new Date(selectedDate+'T'+fromMin(t)+':00').getTime();if(when<minTime)continue;const overlapping=existing.filter(a=>{const es=(d.services||[]).find(x=>x.id===a.serviceId),as=toMin(a.time),ae=as+Number(es?.duration||30);return overlaps(t,t+duration,as,ae)});let ok=overlapping.length===0,overbook=false;if(overlapping.length){if(s.allowOverbook&&overlapping.every(a=>Boolean((d.services||[]).find(x=>x.id===a.serviceId)?.allowOverbook))){const limits=[Math.max(1,Number(s.maxConcurrent||1)),...overlapping.map(a=>Math.max(1,Number((d.services||[]).find(x=>x.id===a.serviceId)?.maxConcurrent||1)))];const limit=Math.min(...limits);ok=overlapping.length<limit;overbook=ok}}if(ok)out.push({time:fromMin(t),end:fromMin(t+duration),overbook})}return out}
async function loadSlots(){selectedTime='';if(!selectedService||!selectedDate){slots=[];render();return}try{if(api){const r=await fetch(`${api}/api/availability?slug=${encodeURIComponent(slug)}&date=${encodeURIComponent(selectedDate)}&serviceId=${encodeURIComponent(selectedService)}`);if(!r.ok)throw new Error(await r.text());const j=await r.json();slots=j.slots||[]}else slots=localAvailability();render()}catch(e){slots=[];render(String(e.message||e))}}
function maxDate(){const d=new Date();d.setDate(d.getDate()+Number(cfg?.bookingSettings?.maxAdvanceDays||30));return iso(d)}
function render(err=''){const services=(cfg?.services||[]).filter(s=>s.onlineEnabled!==false),srv=selectedSrv(),bs=cfg?.bookingSettings||{};$('#app').innerHTML=`<div class="brand">Reserva online</div><h1>${esc(cfg?.businessName||'Barbería')}</h1><div class="lead">Elegí el servicio y un horario disponible. No necesitás instalar ninguna aplicación.</div>${!bs.enabled?'<div class="error">Las reservas online están desactivadas temporalmente.</div>':''}${err?`<div class="error">${esc(err)}</div>`:''}<section class="card"><h2>1. Servicio</h2><div class="serviceGrid">${services.map(s=>`<button class="service ${selectedService===s.id?'active':''}" data-srv="${s.id}"><b>${esc(s.name)}</b><small>${s.duration} min · ${money(s.price)}${s.allowOverbook?' · admite sobreturno':''}</small></button>`).join('')||'<div class="info">No hay servicios disponibles para reservar online.</div>'}</div></section><section class="card"><h2>2. Día y horario</h2><label class="field"><span>Fecha</span><input id="date" type="date" min="${today}" max="${maxDate()}" value="${selectedDate}"></label>${selectedService?`<div class="slots">${slots.map(x=>`<button class="slot ${selectedTime===x.time?'active':''}" data-time="${x.time}">${x.time}<small>hasta ${x.end}${x.overbook?' · sobreturno':''}</small></button>`).join('')}</div>${!slots.length?'<div class="info">No hay horarios disponibles para esta fecha.</div>':''}`:'<div class="info">Primero elegí un servicio.</div>'}</section><section class="card"><h2>3. Tus datos</h2><label class="field"><span>Nombre</span><input id="name" autocomplete="name"></label><label class="field"><span>WhatsApp / teléfono</span><input id="phone" inputmode="tel" autocomplete="tel"></label><label class="field"><span>Nota (opcional)</span><textarea id="note" placeholder="Algo que el barbero necesite saber sobre este turno"></textarea></label>${srv&&selectedTime?`<div class="summary"><b>${esc(srv.name)} · ${selectedDate} · ${selectedTime}</b><br>Duración estimada: ${srv.duration} minutos · finaliza aprox. ${slots.find(x=>x.time===selectedTime)?.end||''}</div>`:''}<button id="submit" class="btn" ${!bs.enabled||!selectedService||!selectedTime?'disabled':''}>Reservar turno</button></section><div class="mode">${api?'Agenda online':'Modo demo local · para usar desde otro celular hay que conectar el backend'}</div>`;document.querySelectorAll('[data-srv]').forEach(b=>b.onclick=()=>{selectedService=b.dataset.srv;loadSlots()});const di=$('#date');if(di)di.onchange=()=>{selectedDate=di.value;loadSlots()};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{selectedTime=b.dataset.time;render()});const sb=$('#submit');if(sb)sb.onclick=submitBooking}
function localSubmit(body){const d=localData();if(!d)throw new Error('No se encontró la agenda local.');let c=(d.clients||[]).find(x=>String(x.phone||'').replace(/\D/g,'')===String(body.clientPhone||'').replace(/\D/g,'')&&body.clientPhone);if(!c){c={id:'c'+Date.now(),name:body.clientName,phone:body.clientPhone,freq:30,tech:{},followUpContactedFor:'',followUpContactedAt:''};d.clients=(d.clients||[]);d.clients.unshift(c)}const s=(d.services||[]).find(x=>x.id===body.serviceId),status=(d.settings?.onlineBookings?.approvalMode||'auto')==='auto'?'confirmed':'pending';d.appointments=(d.appointments||[]);d.appointments.push({id:'ap'+Date.now(),clientId:c.id,serviceId:body.serviceId,date:body.date,time:body.time,status,price:Number(s?.price||0),factor:1,label:'Normal',consumed:false,paidAmount:0,depositAmount:0,paymentStatus:'pending',note:body.note||'',waConfirmSentAt:'',waReminderSentAt:'',source:'online',onlineBookingId:'local-'+Date.now(),requestedAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(d));return {status}}
async function submitBooking(){const name=$('#name').value.trim(),phone=$('#phone').value.trim(),note=$('#note').value.trim();if(!name||!phone)return alert('Completá nombre y teléfono.');const body={slug,serviceId:selectedService,date:selectedDate,time:selectedTime,clientName:name,clientPhone:phone,note};try{let result;if(api){const r=await fetch(api+'/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());result=await r.json()}else result=localSubmit(body);const srv=selectedSrv();$('#app').innerHTML=`<div class="success"><h2 style="margin-top:0">${result.status==='confirmed'?'Turno confirmado':'Solicitud enviada'}</h2><div>${esc(name)}, reservaste <b>${esc(srv?.name||'servicio')}</b> para el <b>${esc(selectedDate)}</b> a las <b>${esc(selectedTime)}</b>.</div>${result.status!=='confirmed'?'<div style="margin-top:8px">La barbería debe confirmar el turno.</div>':''}</div><button class="btn" style="margin-top:14px" onclick="location.reload()">Reservar otro turno</button>`}catch(e){alert('No se pudo reservar: '+String(e.message||e));await loadSlots()}}
loadConfig().then(c=>{cfg=c;selectedService=(c.services||[]).find(s=>s.onlineEnabled!==false)?.id||'';const bs=c.bookingSettings||{};const md=new Date();if(!(bs.workingDays||[]).map(Number).includes(md.getDay())){for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()+i);if((bs.workingDays||[]).map(Number).includes(d.getDay())){selectedDate=iso(d);break}}}loadSlots()}).catch(e=>{$('#app').innerHTML=`<div class="error">${esc(e.message||e)}</div>`});
})();
</script></body></html>
